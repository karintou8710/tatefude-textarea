name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 縦組みの送りを実際の字で測りたい。CJK フォントが無いと豆腐になる
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pnpm --filter tatefude-textarea exec playwright install --with-deps chromium webkit
      - run: pnpm --filter tatefude-textarea test:browser
      - run: pnpm build
